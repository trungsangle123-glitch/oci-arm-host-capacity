name: Create A1 instance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Needed so the workflow can disable itself after success
permissions:
  contents: read
  actions: write

# Never run two attempts at the same time
concurrency:
  group: create-a1
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Write OCI private key
        env:
          OCI_KEY_B64: ${{ secrets.OCI_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p /home/runner/.oci
          echo "$OCI_KEY_B64" | base64 -d > /home/runner/.oci/oci_key.pem
          chmod 600 /home/runner/.oci/oci_key.pem

      - name: Try to create instance
        run: |
          # Capacity errors make the script fail; don't mark the run as failed
          set +e
          php ./index.php 2>&1 | tee output.txt
          exit 0
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /home/runner/.oci/oci_key.pem
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_SHAPE: ${{ secrets.OCI_SHAPE }}
          OCI_MAX_INSTANCES: ${{ secrets.OCI_MAX_INSTANCES }}
          OCI_BOOT_VOLUME_SIZE_IN_GBS: ${{ secrets.OCI_BOOT_VOLUME_SIZE_IN_GBS }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}

      - name: Disable workflow after success
        env:
          GH_TOKEN: ${{ github.token }}
          # Adjust this to whatever index.php prints when an instance is created.
          # It must NOT appear in "Out of host capacity" error output.
          SUCCESS_PATTERN: lifecycleState
        run: |
          if grep -qi "$SUCCESS_PATTERN" output.txt && ! grep -qi "out of host capacity" output.txt; then
            echo "Instance created, disabling workflow."
            gh workflow disable "${{ github.workflow }}" --repo "$GITHUB_REPOSITORY"
          else
            echo "No instance created this run."
          fi
